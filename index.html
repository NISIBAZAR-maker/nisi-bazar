<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisi Bazar</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Requirement 2: Styled Dark Gradient Background */
        body {
            background: radial-gradient(circle at top left, #1f0814, #0d0d12 60%, #050508);
            color: #ffffff;
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* Header Layout */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(13, 13, 18, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 0, 127, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #ff007f;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Requirement 3: Customer Reviews Popup Button */
        .btn-reviews-popup {
            background: rgba(255, 0, 127, 0.15);
            color: #ff007f;
            border: 1px solid #ff007f;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        .btn-reviews-popup:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
        }

        .cart-icon {
            position: relative;
            background: rgba(255, 0, 127, 0.1);
            border: 1px solid #ff007f;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ff007f;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.3);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff007f;
            color: white;
            font-size: 12px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }

        /* Main Content Grid */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .section-title {
            margin-bottom: 20px;
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        /* Product Card Styling */
        .product-card {
            background: rgba(25, 25, 35, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 0, 127, 0.4);
        }

        .product-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #1a1a24;
        }

        .product-title {
            font-size: 15px;
            font-weight: 600;
        }

        .price-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .price {
            color: #ff007f;
            font-size: 18px;
            font-weight: bold;
        }

        .old-price {
            color: #888;
            text-decoration: line-through;
            font-size: 13px;
        }

        /* Requirement 1: Highly Visible Action Buttons (Info, Chat, Review) */
        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .btn-action {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 0, 127, 0.5); /* Glowing outline */
            color: #ffffff;
            padding: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s ease;
            text-align: center;
        }

        .btn-action:hover {
            background: #ff007f;
            border-color: #ff007f;
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .btn-add-cart {
            background: #ff007f;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.3s;
        }

        .btn-add-cart:hover {
            background: #e0006f;
        }

        /* Customer Reviews Modal/Popup Styling */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: #15151e;
            border: 1px solid #ff007f;
            width: 90%;
            max-width: 500px;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.3);
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #ff007f;
        }

        .review-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #ff007f;
        }

        .review-user {
            font-weight: bold;
            font-size: 14px;
            color: #ff007f;
        }

        .review-stars {
            color: #ffc107;
            font-size: 12px;
            margin: 3px 0;
        }

        .review-text {
            font-size: 13px;
            color: #ddd;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo">Nisi Bazar</div>
        <div class="header-actions">
            <!-- Customer Reviews Popup Trigger Button -->
            <button class="btn-reviews-popup" id="openReviewsBtn">
                <i class="fa-solid fa-star"></i> Reviews
            </button>
            <div class="cart-icon">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge">1</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <div class="container">
        <h2 class="section-title"><i class="fa-solid fa-fire" style="color:#ff007f;"></i> Featured Products</h2>
        
        <div class="product-grid">
            <!-- Product Card Example -->
            <div class="product-card">
                <img src="https://via.placeholder.com/250x160" alt="Product" class="product-img">
                <div class="product-title">Premium Stainless Water Flask 1L</div>
                <div class="price-row">
                    <span class="price">$15.99</span>
                    <span class="old-price">$19.99</span>
                </div>
                <!-- Visibly Enhanced Buttons -->
                <div class="card-actions">
                    <button class="btn-action">Info</button>
                    <button class="btn-action">Chat</button>
                    <button class="btn-action">Review</button>
                </div>
                <button class="btn-add-cart">
                    <i class="fa-solid fa-cart-plus"></i> Add to Cart
                </button>
            </div>

            <!-- Product Card Example 2 -->
            <div class="product-card">
                <img src="https://via.placeholder.com/250x160" alt="Product" class="product-img">
                <div class="product-title">Rechargeable Mini Turbo Fan</div>
                <div class="price-row">
                    <span class="price">$12.50</span>
                    <span class="old-price">$16.00</span>
                </div>
                <div class="card-actions">
                    <button class="btn-action">Info</button>
                    <button class="btn-action">Chat</button>
                    <button class="btn-action">Review</button>
                </div>
                <button class="btn-add-cart">
                    <i class="fa-solid fa-cart-plus"></i> Add to Cart
                </button>
            </div>
        </div>
    </div>

    <!-- Customer Reviews Modal Popup -->
    <div class="modal-overlay" id="reviewsModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Customer Reviews</h3>
                <button class="modal-close" id="closeReviewsBtn">&times;</button>
            </div>
            <div class="reviews-list">
                <div class="review-item">
                    <div class="review-user">Sanaul Islam</div>
                    <div class="review-stars">★★★★★</div>
                    <div class="review-text">Product quality is top-notch! Super fast delivery.</div>
                </div>
                <div class="review-item">
                    <div class="review-user">Tanvir Ahmed</div>
                    <div class="review-stars">★★★★☆</div>
                    <div class="review-text">Very good dark theme design and customer support is fast.</div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for Popup Logic -->
    <script>
        const modal = document.getElementById('reviewsModal');
        const openBtn = document.getElementById('openReviewsBtn');
        const closeBtn = document.getElementById('closeReviewsBtn');

        openBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
        });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
