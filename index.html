<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NISI BAZAR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-color: #0b0710;
      --card-bg: #15101a;
      --accent: #ff007f;
      --accent-hover: #e0006f;
      --text-main: #ffffff;
      --text-muted: #a098ae;
      --border-color: #261b30;
      --star-color: #ffb703;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 70px;
    }

    /* Top Bar Rules */
    .top-bar {
      background: #000000;
      color: var(--text-muted);
      font-size: 11px;
      padding: 6px 0;
      overflow: hidden;
      white-space: nowrap;
      border-bottom: 1px solid var(--border-color);
    }
    .marquee {
      display: inline-block;
      animation: scroll 20s linear infinite;
    }
    @keyframes scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }

    /* Main Header */
    header {
      background-color: var(--card-bg);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .brand-icon {
      color: var(--accent);
      font-size: 22px;
    }
    .brand-text h1 {
      color: var(--accent);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .brand-text p {
      color: var(--text-muted);
      font-size: 8px;
      letter-spacing: 1.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-review-trigger {
      background: rgba(255, 0, 127, 0.1);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.3s;
    }

    .cart-trigger {
      background: var(--accent);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      cursor: pointer;
    }
    .cart-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #fff;
      color: var(--accent);
      font-size: 10px;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Section Title */
    .section-header {
      padding: 15px 20px 5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header h2 {
      font-size: 16px;
      font-weight: 700;
    }
    .section-header i {
      color: var(--accent);
    }

    /* Products Grid */
    .products-container {
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
    }

    .img-container {
      width: 100%;
      height: 220px;
      background: #000;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .product-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 5px;
    }

    .video-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .video-tag i {
      color: var(--accent);
      font-size: 8px;
    }

    .product-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .price {
      color: var(--accent);
      font-size: 18px;
      font-weight: 700;
    }
    .old-price {
      color: var(--text-muted);
      font-size: 12px;
      text-decoration: line-through;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
    }
    .rating {
      color: var(--star-color);
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .card-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .btn-action {
      background: #1f1826;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }

    .btn-add-cart {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
    }

    /* Fixed Bottom Bar */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: var(--accent);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 99;
    }
    .cart-summary {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
    }
    .total-price {
      background: #fff;
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 800;
    }

    /* Mobile Optimization */
    @media (max-width: 600px) {
      header {
        padding: 10px 15px;
      }
      .brand-text h1 {
        font-size: 16px;
      }
      .brand-text p {
        font-size: 7px;
      }
      .img-container {
        height: 200px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Announcement -->
  <div class="top-bar">
    <div class="marquee">🔒 100% Discrete Shipping • Private Packaging • Safe Delivery</div>
  </div>

  <!-- Header -->
  <header>
    <a href="#" class="brand-logo">
      <i class="fa-solid fa-bag-shopping brand-icon"></i>
      <div class="brand-text">
        <h1>NISI BAZAR</h1>
        <p>PRIVATE • DISCREET • TRUSTED</p>
      </div>
    </a>
    <div class="header-right">
      <button class="btn-review-trigger">
        <i class="fa-solid fa-star"></i> Reviews
      </button>
      <div class="cart-trigger">
        <i class="fa-solid fa-cart-shopping"></i>
        <span class="cart-count">1</span>
      </div>
    </div>
  </header>

  <!-- Section Title -->
  <div class="section-header">
    <i class="fa-solid fa-fire"></i>
    <h2>Featured Products</h2>
  </div>

  <!-- Products Grid -->
  <main class="products-container">

    <!-- ==================== PRODUCT 1 ==================== -->
    <div class="product-card">
      <div class="img-container">
        <img src="https://i.ibb.co.com/rKMR8H4W/Gemini-Generated-Image-hmnc5fhmnc5fhmnc-clean.png" alt="Premium Eagle Pocket Knife" class="product-img">
        <div class="video-tag"><i class="fa-solid fa-play"></i> Video</div>
      </div>
      <div class="product-title">Premium Eagle Pocket Knife</div>
      <div class="price-row">
        <span class="price">$6.99</span>
        <span class="old-price">$10.99</span>
      </div>
      <div class="meta-row">
        <span>Sold: 143</span>
        <span class="rating"><i class="fa-solid fa-star"></i> 4.8</span>
      </div>
      <div class="card-actions">
        <button class="btn-action">Info</button>
        <button class="btn-action">Chat</button>
        <button class="btn-action">Review</button>
      </div>
      <button class="btn-add-cart"><i class="fa-solid fa-cart-shopping"></i> Add to Cart</button>
    </div>
    <!-- =================================================== -->

  </main>

  <!-- Bottom Bar -->
  <div class="bottom-bar">
    <div class="cart-summary">
      <i class="fa-solid fa-basket-shopping"></i>
      <span>View Cart</span>
    </div>
    <div class="total-price">$0.00</div>
  </div>

</body>
</html>
