<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nisi Bazar</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background-color: #f4f4f9; color: #333; }
        h1 { text-align: center; color: #0088cc; }
        .product-card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-title { font-size: 18px; font-weight: bold; }
        .price { color: #27ae60; font-size: 16px; font-weight: bold; margin: 5px 0; }
        .btn { background: #0088cc; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; margin-right: 5px; margin-top: 5px; }
        .btn-cart { background: #27ae60; }
        .tab-content { display: none; margin-top: 10px; padding: 10px; background: #eee; border-radius: 5px; font-size: 14px; }
        .checkout-section { background: white; padding: 15px; border-radius: 10px; margin-top: 20px; }
        input, textarea { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

    <h1>Nisi Bazar</h1>

    <!-- Sample Product -->
    <div class="product-card">
        <div class="product-title">Sample Product 1</div>
        <div class="price">$10.00</div>
        <p>Total Sold: 25</p>
        
        <button class="btn" onclick="toggleTab('desc1')">Product Info</button>
        <button class="btn" onclick="toggleTab('comm1')">Comments</button>
        <button class="btn" onclick="toggleTab('rev1')">Reviews</button>
        <button class="btn btn-cart" onclick="addToCart('Sample Product 1')">Add to Cart</button>

        <div id="desc1" class="tab-content">This is a high quality digital product.</div>
        <div id="comm1" class="tab-content">Customer A: Very good!</div>
        <div id="rev1" class="tab-content">⭐⭐⭐⭐⭐ (5/5 based on 10 reviews)</div>
    </div>

    <!-- Checkout Form -->
    <div class="checkout-section">
        <h3>Checkout & Payment</h3>
        <p><b>Binance Pay ID:</b> 123456789</p>
        <label>Name:</label>
        <input type="text" id="name" placeholder="Your Name">
        <label>Phone / Contact:</label>
        <input type="text" id="phone" placeholder="Your Phone or Telegram Username">
        <label>Binance TxID:</label>
        <input type="text" id="txid" placeholder="Transaction ID">
        <label>Payment Proof (Image Link / Details):</label>
        <input type="text" id="proof" placeholder="Paste image link or note">
        <button class="btn btn-cart" style="width: 100%; padding: 12px;" onclick="placeOrder()">Place Order</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function toggleTab(id) {
            let el = document.getElementById(id);
            el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function addToCart(product) {
            alert(product + ' added to cart!');
        }

        function placeOrder() {
            let name = document.getElementById('name').value;
            let phone = document.getElementById('phone').value;
            let txid = document.getElementById('txid').value;

            if(!name || !phone || !txid) {
                alert('Please fill in all details!');
                return;
            }

            let data = {
                name: name,
                phone: phone,
                txid: txid
            };

            tg.sendData(JSON.stringify(data));
            tg.close();
        }
    </script>
</body>
</html>
